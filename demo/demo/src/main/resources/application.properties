spring.application.name=demo

# ===================================================================
#  1. DATASOURCE (資料庫連線)
# ===================================================================
# 這是你的 MySQL 資料庫連線 URL
# - localhost:3306: 你的資料庫伺服器位置和埠口
# - investment_db: 你的資料庫名稱 (*** 你需要手動建立這個資料庫 ***)
# - useSSL=false: 關閉 SSL 連線 (開發時常用)
# - serverTimezone=Asia/Taipei: 設定正確的時區，避免時間錯誤
#password=qweasdzxc123
spring.datasource.url=jdbc:mysql://localhost:3306/investment_db?useSSL=false&serverTimezone=Asia/Taipei

# 你的 MySQL 登入帳號 (root 是預設值)
spring.datasource.username=root

# 你的 MySQL 登入密碼 (*** 請改成你自己的密碼 ***)
spring.datasource.password=qweasdzxc123

# ===================================================================
#  2. JPA / HIBERNATE (資料庫操作)
# ===================================================================
# (最重要) 自動更新資料表結構
# - update: Spring Boot 啟動時，會自動檢查你的 @Entity 類別，
#           如果資料表不存在就建立，如果欄位有少就新增。
spring.jpa.hibernate.ddl-auto=update

# 在控制台顯示 Spring Data JPA 實際執行的 SQL 語法 (方便除錯)
spring.jpa.show-sql=true

# 告訴 Hibernate 我們用的是 MySQL 的語法
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
#  3. SERVER (伺服器)
# ===================================================================
# 設定你的 Spring Boot 後端伺服器要跑在哪個埠口 (8080 是預設值)
# (你的 Vue 前端可能會跑在 5173，後端跑在 8080)
server.port=8080